spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-headers: '*'
            allowed-methods: '*'
      routes:
        - id: order-route
          uri: lb://service-order
          predicates:
            - Path=/api/order/**  # 两个 * 表示所有请求
          filters:
            - RewritePath=/api/order/(?<segment>.*), /$\{segment}
            - OnceToken=X-Response-Token, jwt
        - id: product-route
          uri: lb://service-product
          predicates:
            - Path=/api/product/**
          filters:
            - RewritePath=/api/product/(?<segment>.*), /$\{segment}
        - id: baidu-route
          uri: https://www.baidu.com
          predicates:
            - name: Path
              args:
                pattern: /s
            - name: Query
              args:
                param: wd
                regexp: springboot
            - Grey=user,zhangsan
      default-filters:
        - AddResponseHeader=X-Response-Source, api
